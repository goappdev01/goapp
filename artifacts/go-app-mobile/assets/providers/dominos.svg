<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#006491"/>
  <!-- Domino tile outline -->
  <rect x="22" y="18" width="56" height="64" rx="6" fill="white"/>
  <!-- Divider line -->
  <rect x="22" y="47" width="56" height="4" fill="#006491"/>
  <!-- Top half: red background with dots -->
  <rect x="22" y="18" width="56" height="29" rx="6" fill="#E31837"/>
  <!-- Top dots (3 dots in triangle arrangement) -->
  <circle cx="38" cy="30" r="5" fill="white"/>
  <circle cx="62" cy="30" r="5" fill="white"/>
  <circle cx="50" cy="42" r="5" fill="white"/>
  <!-- Bottom half: dots on white -->
  <!-- 2 dots -->
  <circle cx="38" cy="62" r="5" fill="#006491"/>
  <circle cx="62" cy="62" r="5" fill="#006491"/>
  <!-- 1 dot center -->
  <circle cx="50" cy="74" r="5" fill="#006491"/>
</svg>
