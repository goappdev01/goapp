openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /supabase/businesses:
    get:
      operationId: listBookableBusinesses
      tags: [bookings]
      summary: List businesses with public booking enabled
      responses:
        "200":
          description: Bookable businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
  /supabase/services:
    get:
      operationId: listBookableServices
      tags: [bookings]
      summary: List active services
      parameters:
        - name: business_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /supabase/bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBooking"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Requested time is already occupied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Authorization bearer token is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        address: { type: string, nullable: true }
        timezone: { type: string }
        booking_enabled: { type: boolean }
        verified: { type: boolean }
      required: [id, name]
    Service:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        duration_minutes: { type: number, minimum: 1, description: Duration in whole minutes }
        price: { nullable: true }
        currency: { type: string }
        active: { type: boolean }
      required: [id, business_id, name, duration_minutes]
    Booking:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        service_id: { type: string }
        staff_id: { type: string, nullable: true }
        customer_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW] }
        notes: { type: string, nullable: true }
      required: [id, business_id, service_id, customer_id, starts_at, ends_at, status]
    CreateBooking:
      type: object
      properties:
        business_id: { type: string }
        service_id: { type: string }
        staff_id: { type: string, nullable: true }
        customer_id: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, CONFIRMED] }
        notes: { type: string, nullable: true }
      required: [business_id, service_id, starts_at, ends_at]
    BookingConflict:
      type: object
      properties:
        error: { type: string, const: BOOKING_CONFLICT }
        code: { type: string }
        message: { type: string }
      required: [error, code, message]
    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]

