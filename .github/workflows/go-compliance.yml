name: GO privacy and human-control regression
on:
  pull_request:
    paths:
      - 'lib/api-zod/src/**'
      - 'artifacts/go-app-mobile/**'
      - 'artifacts/api-server/src/**'
      - 'docs/compliance/**'
      - 'scripts/check-go-compliance.mjs'
      - 'scripts/tests/go-compliance.test.mjs'
      - '.github/workflows/go-compliance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-compliance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, checked 2026-11-27
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, checked 2026-11-27
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-go-compliance.mjs
      - run: node --experimental-strip-types --experimental-vm-modules --test scripts/tests/go-compliance.test.mjs
